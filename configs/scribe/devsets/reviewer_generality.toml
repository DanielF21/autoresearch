# Labelled patches for checking the mergeability reviewer. Every label is the
# measurement in artifacts/generality.md section 1: each patch timed at five
# densities at n=1000 against stock. "regresses" is a worst ratio below 1.
#
# Confound, stated so nobody scores it by accident: every regressor adds a numpy
# import and no safe patch does. review_check only counts a regressor as caught
# when the reviewer's reasons name the inputs at risk.

risk_keywords = ["sparse", "low degree", "average degree", "few edges", "density", "number of nodes", "node count", "n^3", "n**3", "n³", "dense matrix"]

