# Writer method v1. The starting point for hill climbing, not a tuned method.
# Every knob is a guess sized so one draft loop exercises critique feedback.
# accept_rate stays absent until a calibration run measures the judge's chance
# rate and its rate on real bodies; production refuses to accept without it
# unless told the method is uncalibrated.

name = "v1"

[review]
mode = "diff_only"      # the reviewer sees code and code facts, no measurements or rationale

[write]
k = 2                   # drafts per iteration
iterations = 3
patience = 1            # iterations without a better draft before stopping
exemplars = 4           # corpus exemplar bodies shown to the writer
angles = [
  "Open with the mechanism: what the old code did on every call, and what the new code does instead.",
  "Open with the measured result across the input shapes, then explain the mechanism that produces it.",
]

[judge]
decoys = 3              # real holdout bodies shown next to each draft
shuffles = 2            # orderings per discrimination judgement

[checks]
lint_max_corpus_rate = 0.15   # a pattern firing in more than this share of real bodies is not slop here
require_input_coverage = true

# Slop patterns. Data, not code: tune by editing this file. A pattern that the
# target's own contributors use above lint_max_corpus_rate is dropped for that
# corpus, so the lint never punishes the repository's real style.

[[slop]]
name = "em dash"
regex = '—'

[[slop]]
name = "buzzwords"
regex = '(?i)\b(delve|leverag(e|es|ed|ing)|seamless(ly)?|robust(ness)?|comprehensive|streamlin(e|es|ed|ing)|utiliz(e|es|ed|ing)|showcas(e|es|ing)|pivotal|game.?changer|cutting.?edge|holistic)\b'

[[slop]]
name = "connectives"
regex = '(?i)\b(furthermore|moreover|additionally|notably|importantly|in summary|in conclusion|overall,)\b'

[[slop]]
name = "unquantified intensifiers"
regex = '(?i)\b(significant(ly)?|dramatic(ally)?|substantial(ly)?|massive(ly)?|drastic(ally)?|greatly|vastly|tremendous(ly)?)\b'

[[slop]]
name = "filler"
regex = '(?i)\b(in order to|it is worth noting|it.s worth noting|it should be noted|plays a (key|crucial|vital) role|a testament to|at the end of the day)\b'

[[slop]]
name = "stock section headers"
regex = '(?im)^#{1,6}\s*(summary|overview|motivation|key changes|changes made|testing|performance impact|conclusion|benefits)\s*:?\s*$'

[[slop]]
name = "bold labels"
regex = '\*\*[^*\n]{1,40}:\*\*'

[[slop]]
name = "sign offs"
regex = '(?i)\b(i hope this helps|let me know if|feel free to|happy to (address|make|adjust))\b'

[[slop]]
name = "not just but"
regex = '(?i)\bnot (just|only) [^.\n]{1,60}, but\b'

[[slop]]
name = "emoji"
regex = '[✅✨⚡\U0001F300-\U0001FAFF]'
